services:
  - type: web
    name: focusbraker-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: focusbraker-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: focusbraker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: focusbraker-db
          property: password
    healthCheckPath: /actuator/health

databases:
  - name: focusbraker-db
    plan: free
    region: singapore
